name: Continuum lab (offline)
on:
  pull_request:
    paths:
      - 'research/continuum_lab/**'
      - '.github/workflows/continuum-lab.yml'
  workflow_dispatch:

jobs:
  continuum-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library unit tests
        run: python -m unittest discover -s research/continuum_lab -p 'test_*.py' -v
      - name: Run deterministic CPU-only benchmark
        run: python research/continuum_lab/runner.py --trials 24 --budget 3 --output /tmp/continuum-ci.json
